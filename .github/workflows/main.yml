name: "Build"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linting:
    name: Static linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
      - name: Install pinned npm for dependency policy
        run: npm install --global --ignore-scripts npm@12.2.3 --registry=https://registry.npmjs.org/

      - name: Install NPM dependencies
        run: npm ci

      - name: ESLint
        run: npm run eslint:ci

      - name: Prettier
        run: npm run prettier:ci

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
      - name: Install pinned npm for dependency policy
        run: npm install --global --ignore-scripts npm@12.2.3 --registry=https://registry.npmjs.org/

      - name: Install NPM dependencies
        run: npm ci

      - name: Tests
        run: npm run test:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
      - name: Install pinned npm for dependency policy
        run: npm install --global --ignore-scripts npm@12.2.3 --registry=https://registry.npmjs.org/

      - name: Install NPM dependencies
        run: npm ci

      - name: Build
        run: npm run build

  github-action-test:
    name: Github Action Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Github Action in dry-run mode
        uses: ./
        with:
          dry-run: true

  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Docker image
        run: docker build --no-cache -t github-release-action:test .

      - name: Run smoke test
        run: |
          output="$(docker run --rm github-release-action:test --smoke-test)"
          echo "$output"
          echo "$output" | grep -qF "GITHUB_RELEASE_ACTION_RUNTIME=typescript-v1"
          echo "$output" | grep -qF "TypeScript Docker runtime smoke test passed."

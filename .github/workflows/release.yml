name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

          persist-credentials: true # Needed by the release/push step
      - uses: ./
        with:
          ci-workflows: none
    permissions:
      contents: write
      pull-requests: write
    if: github.ref == 'refs/heads/main'
